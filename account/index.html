<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="robots" content="noindex">
    <title>구독 관리 - Ollarai</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NKE2BBMBGT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NKE2BBMBGT');
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="/src/account.js"></script>
</head>
<body class="text-slate-200 min-h-screen min-h-dvh flex flex-col">

    <nav class="sticky top-0 w-full z-50 glass-morphism py-4">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center gap-4">
            <a href="/app/" class="flex items-center gap-2 cursor-pointer">
                <span class="text-2xl md:text-3xl tracking-tighter text-white ollarai-brand">Ollarai</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-widest" style="background-color: rgba(116, 210, 78, 0.15); color: rgb(116, 210, 78);">Beta</span>
            </a>
            <div class="flex items-center gap-3 md:gap-4 text-sm">
                <div id="lang-switch" class="relative"></div>
                <button id="logout-btn" type="button" class="text-slate-400 hover:text-white transition" data-i18n="app.logout">로그아웃</button>
            </div>
        </div>
    </nav>

    <main class="flex-1 w-full container mx-auto px-4 md:px-6 pt-12 md:pt-16 pb-24 max-w-2xl">
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-8 tracking-tight" data-i18n="account.title">구독 관리</h1>

        <div id="account-loading" class="flex justify-center py-16"><span class="beta-spinner"></span></div>

        <div id="account-error" class="hidden glass-morphism rounded-2xl p-6 text-center">
            <p class="text-slate-400 mb-6" data-i18n="account.load-failed">구독 정보를 불러오지 못했어요.</p>
            <button id="account-retry" type="button" class="px-6 py-2.5 rounded-xl font-bold border border-white/15 hover:bg-white/5 transition" data-i18n="app.retry">다시 시도</button>
        </div>

        <!-- Filled by src/account.js from GET /me -->
        <div id="account-body" class="hidden flex-col gap-6"></div>
    </main>
</body>
</html>
