<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="robots" content="noindex">
    <title>Ollarai Beta</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NKE2BBMBGT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NKE2BBMBGT');
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="/src/app.js"></script>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <nav class="sticky top-0 w-full z-50 glass-morphism py-4">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center gap-4">
            <a href="/" class="flex items-center gap-2 cursor-pointer">
                <span class="text-2xl md:text-3xl tracking-tighter text-white ollarai-brand">Ollarai</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-widest" style="background-color: rgba(116, 210, 78, 0.15); color: rgb(116, 210, 78);">Beta</span>
            </a>
            <div id="account" class="hidden items-center gap-3 md:gap-4 text-sm">
                <span id="usage-badge" class="hidden px-3 py-1 rounded-full bg-white/5 border border-white/10 text-slate-300 text-xs tabular-nums"></span>
                <span id="account-email" class="hidden md:inline text-slate-400 truncate max-w-[220px]"></span>
                <button id="logout-btn" type="button" class="text-slate-400 hover:text-white transition">로그아웃</button>
            </div>
        </div>
    </nav>

    <main class="flex-1 w-full">
        <!-- Loading -->
        <section id="view-loading" class="beta-view container mx-auto px-4 py-32 flex justify-center">
            <span class="beta-spinner"></span>
        </section>

        <!-- First visit: start the beta -->
        <section id="view-start" class="beta-view hidden container mx-auto px-4 py-24 md:py-32">
            <div class="glass-morphism rounded-3xl p-8 md:p-12 max-w-lg mx-auto text-center">
                <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 border" style="background-color: rgba(116, 210, 78, 0.2); border-color: rgba(116, 210, 78, 0.3);">
                    <i class="fas fa-rocket text-primary text-2xl"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-white mb-3">베타 테스트에 오신 걸 환영해요</h1>
                <p class="text-slate-400 leading-relaxed mb-8">공시 원본 데이터에 자연어로 질문하고,<br>SQL로 조회한 결과를 표로 바로 확인해 보세요.</p>
                <button id="start-btn" type="button" class="bg-primary bg-primary-hover text-white px-10 py-4 rounded-2xl font-bold text-lg transition-all hover:scale-105">베타 테스트 시작</button>
            </div>
        </section>

        <!-- Waiting for approval -->
        <section id="view-pending" class="beta-view hidden container mx-auto px-4 py-24 md:py-32">
            <div class="glass-morphism rounded-3xl p-8 md:p-12 max-w-lg mx-auto text-center">
                <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 bg-white/5 border border-white/10">
                    <i class="fas fa-hourglass-half text-slate-300 text-2xl"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-white mb-3">승인을 기다리고 있어요</h1>
                <p class="text-slate-400 leading-relaxed mb-8">베타 참여 신청이 접수됐어요.<br>승인이 완료되면 바로 이용하실 수 있어요.</p>
                <button id="pending-refresh-btn" type="button" class="px-8 py-3 rounded-xl font-bold border border-white/15 hover:bg-white/5 transition disabled:opacity-60">승인 상태 확인</button>
                <p id="pending-hint" class="hidden text-slate-500 text-sm mt-4">아직 승인 대기 중이에요.</p>
            </div>
        </section>

        <!-- Blocked -->
        <section id="view-blocked" class="beta-view hidden container mx-auto px-4 py-24 md:py-32">
            <div class="glass-morphism rounded-3xl p-8 md:p-12 max-w-lg mx-auto text-center">
                <h1 class="text-2xl font-bold text-white mb-3">이용이 제한된 계정이에요</h1>
                <p class="text-slate-400 leading-relaxed">문의: <a href="mailto:taeho@ollarai.com" class="text-primary underline underline-offset-2">taeho@ollarai.com</a></p>
            </div>
        </section>

        <!-- Error loading account -->
        <section id="view-error" class="beta-view hidden container mx-auto px-4 py-24 md:py-32">
            <div class="glass-morphism rounded-3xl p-8 md:p-12 max-w-lg mx-auto text-center">
                <h1 class="text-2xl font-bold text-white mb-3">서비스에 연결하지 못했어요</h1>
                <p id="view-error-message" class="text-slate-400 leading-relaxed mb-8"></p>
                <button id="error-retry-btn" type="button" class="px-8 py-3 rounded-xl font-bold border border-white/15 hover:bg-white/5 transition">다시 시도</button>
            </div>
        </section>

        <!-- Question + result tables -->
        <section id="view-query" class="beta-view hidden container mx-auto px-4 md:px-6 pt-12 md:pt-20 pb-24 max-w-5xl">
            <h1 class="text-3xl md:text-4xl font-bold text-white text-center mb-8 tracking-tight">무엇이 궁금하세요?</h1>

            <form id="query-form" class="query-box glass-morphism rounded-2xl p-3 md:p-4">
                <textarea id="query-input" rows="2" maxlength="1000" class="w-full bg-transparent resize-none outline-none text-white placeholder-slate-500 text-base md:text-lg leading-relaxed px-2 pt-1" placeholder="예: 삼성전자 최근 4개 분기 영업이익 추이"></textarea>
                <div class="flex items-center justify-between gap-3 pt-2">
                    <span id="query-hint" class="text-slate-500 text-xs pl-2">Enter로 전송 · Shift+Enter로 줄바꿈</span>
                    <button id="query-submit" type="submit" aria-label="질문 보내기" class="w-10 h-10 shrink-0 rounded-xl bg-primary bg-primary-hover text-white flex items-center justify-center transition disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </form>

            <div id="results" class="flex flex-col gap-10 mt-10"></div>
        </section>
    </main>
</body>
</html>
