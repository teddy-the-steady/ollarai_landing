service: ollarai-email-capture

useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:REGION, 'ap-northeast-2'}
  stage: ${opt:stage, 'prod'}
  environment:
    TABLE_NAME: !Ref EmailSubscribersTable
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, '*'}
  apiGateway:
    usagePlan:
      throttle:
        rateLimit: 10
        burstLimit: 20
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
          Resource: !GetAtt EmailSubscribersTable.Arn

functions:
  saveEmail:
    handler: handler.saveEmail
    events:
      - http:
          path: /subscribe
          method: post
          cors:
            origin: ${env:ALLOWED_ORIGIN, '*'}
            headers:
              - Content-Type

resources:
  Resources:
    EmailSubscribersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ollarai-email-subscribers-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
