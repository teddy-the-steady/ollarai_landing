<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="robots" content="noindex">
    <title>결제 완료 - Ollarai</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NKE2BBMBGT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NKE2BBMBGT');
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="/src/thanks.js"></script>
</head>
<body class="text-slate-200 min-h-screen min-h-dvh flex flex-col">

    <nav class="sticky top-0 w-full z-50 glass-morphism py-4">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center gap-4">
            <a href="/" id="home-link" class="flex items-center gap-2 cursor-pointer">
                <span class="text-2xl md:text-3xl tracking-tighter text-white ollarai-brand">Ollarai</span>
            </a>
            <div id="lang-switch" class="relative text-sm"></div>
        </div>
    </nav>

    <!-- After a successful Pro payment: the payment provider's success URL lands here (/thanks/). Language: the one saved as ollarai-lang (set on the pricing page at checkout), else the browser's -->
    <main class="flex-1 w-full container mx-auto px-4 md:px-6 pt-16 md:pt-24 pb-24 max-w-lg text-center">
        <div class="thanks-check" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.5 12.5l3.5 3.5 7.5-8"/></svg>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-4 tracking-tight" data-i18n="thanks.title">구독해 주셔서 감사해요</h1>
        <p class="text-slate-400 mb-10" data-i18n="thanks.lead">Ollarai Pro 결제가 완료됐어요. 이제 모든 유료 기능을 쓸 수 있어요.</p>


        <div class="flex flex-col sm:flex-row gap-3 mb-10">
            <a href="/app/" class="pricing-cta pricing-cta-primary flex-1" data-i18n="thanks.start">Ollarai 시작하기</a>
            <a href="/account/" id="thanks-account" class="pricing-cta pricing-cta-secondary flex-1" data-i18n="thanks.account">구독 설정</a>
        </div>

        <ul class="text-left text-sm text-slate-500 leading-relaxed space-y-2 list-disc pl-5">
            <li data-i18n="thanks.note-delay">Pro가 계정에 반영되기까지 1분 정도 걸릴 수 있어요. 바로 보이지 않으면 잠시 후 새로고침해 주세요.</li>
            <li data-i18n="thanks.note-receipt">결제 영수증은 이메일로 보내드려요. 구독 해지와 결제 내역은 구독 설정에서 확인할 수 있어요.</li>
            <li data-i18n-html="thanks.note-contact">문의: <a href="mailto:contact@ollarai.com" class="underline underline-offset-2 hover:text-primary transition">contact@ollarai.com</a></li>
        </ul>
    </main>
</body>
</html>
